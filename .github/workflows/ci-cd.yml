name: CI-CD Pipeline

# The workflow is automatically triggered on any push to the main branch.
on:
  push:
    branches: [ main ]

# Required repository configuration:
#   - Repository Variable : DOCKER_USERNAME   (your Docker Hub username, lowercase)
#   - Repository Secret   : DOCKER_PASSWORD   (your Docker Hub access token)
#   - Environment "DEV"   : variable "suffix" (e.g. dev)
#   - Environment "PROD"  : variable "suffix" (e.g. prod)

jobs:
  # ============================== CI PHASE ==============================
  ci:
    name: CI - Build / Package / Push image
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CI-1: print all current environment variables
      - name: Print all environment variables
        run: |
          echo "===== Current environment variables ====="
          env | sort
          echo "========================================="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CI-1: basic dependency installation
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build

      # CI-1: compilation (byte-compile the source tree)
      - name: Compile (byte-compile)
        run: |
          python -m compileall -q app
          echo "Byte-compilation finished."

      # CI-1: packaging (build wheel + sdist into dist/)
      - name: Package (build distributions)
        run: |
          python -m build
          echo "----- dist/ contents -----"
          ls -lh dist/

      # CI-3: compute the timestamp tag in the format YYYYmmddHHMMSS
      - name: Compute image repo and timestamp tag
        id: meta
        run: |
          TS="$(date +'%Y%m%d%H%M%S')"
          IMAGE_REPO="docker.io/${{ vars.DOCKER_USERNAME }}/cicd-demo"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TS}" >> "$GITHUB_OUTPUT"
          echo "Image repo : ${IMAGE_REPO}"
          echo "Image tag  : ${TS}"

      # CI-4 & CI-5: username from Repository Variables, password from Repository Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # CI-2: build the image using the Dockerfile in the project root
      - name: Build Docker image
        run: |
          docker build -t "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}" .

      # CI-6: push the tagged image to the container registry (Docker Hub)
      - name: Push image to Docker Hub
        run: |
          docker push "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}"

      # CI-7: export the built image as a .tar archive via docker save
      - name: Export image to tar (docker save)
        run: |
          docker save -o image.tar "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}"
          ls -lh image.tar

      # CI-8: upload the tar archive using actions/upload-artifact
      - name: Upload image tar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: image.tar
          if-no-files-found: error

      # CI-9: print the final image version info on the run page (logs + step summary)
      - name: Print final image version
        run: |
          FULL_IMAGE="${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}"
          echo "Final image: ${FULL_IMAGE}"
          {
            echo "## Final Image Version"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Repository | ${{ steps.meta.outputs.image_repo }} |"
            echo "| Tag (timestamp) | ${{ steps.meta.outputs.image_tag }} |"
            echo "| Full image | ${FULL_IMAGE} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================== CD PHASE ==============================
  # Two separate environments: DEV and PROD. Each has its own "suffix" variable.
  cd-dev:
    name: CD - DEV
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: DEV
    steps:
      # CD-1: download the previously uploaded tar archive
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: .

      - name: Load image from tar
        run: |
          docker load -i image.tar

      # CD-2: retag the image by appending this environment's suffix variable
      - name: Retag image with environment suffix
        run: |
          SRC="${{ needs.ci.outputs.image_repo }}:${{ needs.ci.outputs.image_tag }}"
          DST="${{ needs.ci.outputs.image_repo }}:${{ needs.ci.outputs.image_tag }}-${{ vars.suffix }}"
          echo "Retagging: ${SRC} -> ${DST}"
          docker tag "${SRC}" "${DST}"

      # CD-3: list and print all local images in the current execution environment
      - name: List all local images
        run: |
          echo "===== All local images (DEV) ====="
          docker images
          echo "=================================="

  cd-prod:
    name: CD - PROD
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: PROD
    steps:
      # CD-1: download the previously uploaded tar archive
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: .

      - name: Load image from tar
        run: |
          docker load -i image.tar

      # CD-2: retag the image by appending this environment's suffix variable
      - name: Retag image with environment suffix
        run: |
          SRC="${{ needs.ci.outputs.image_repo }}:${{ needs.ci.outputs.image_tag }}"
          DST="${{ needs.ci.outputs.image_repo }}:${{ needs.ci.outputs.image_tag }}-${{ vars.suffix }}"
          echo "Retagging: ${SRC} -> ${DST}"
          docker tag "${SRC}" "${DST}"

      # CD-3: list and print all local images in the current execution environment
      - name: List all local images
        run: |
          echo "===== All local images (PROD) ====="
          docker images
          echo "==================================="
