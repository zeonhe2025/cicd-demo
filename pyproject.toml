[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-demo"
version = "1.0.0"
description = "Minimal Flask backend for a GitHub Actions CI/CD demo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
]

[tool.setuptools]
packages = ["app"]
